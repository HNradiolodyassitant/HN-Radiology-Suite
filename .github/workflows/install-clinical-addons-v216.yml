name: Recover and Install v2.16.0

on:
  push:
    branches: [main]
    paths:
      - 'tools/clinical_addons_v216/**'
      - '.github/workflows/install-clinical-addons-v216.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore last known-good production index if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          index = Path('index.html')
          good = False
          if index.exists() and index.stat().st_size > 100000:
              text = index.read_text(encoding='utf-8', errors='ignore')
              good = '</body>' in text.lower() and 'HNClinicOutput' in text

          if good:
              print('Current index.html is usable; restore not needed:', index.stat().st_size)
          else:
              package = Path('HN_Radiology_Suite_v2.14.0_PREGNANCY_LOCKED_GITHUB_UPLOAD_READY.zip')
              if not package.exists():
                  raise SystemExit('Recovery package v2.14.0 is missing')
              with ZipFile(package) as z:
                  if 'index.html' not in z.namelist():
                      raise SystemExit('Recovery package has no index.html')
                  data = z.read('index.html')
              if len(data) < 100000 or b'</body>' not in data.lower():
                  raise SystemExit('Recovered index.html failed safety checks')
              index.write_bytes(data)
              print('Restored production index from approved v2.14.0 package:', len(data), 'bytes')
          PY

      - name: Install Twin Pregnancy v2.15.0 safely
        run: |
          cp index.html tools/index.html
          python tools/twin_v215/install_twin_v215.py
          cp tools/index.html index.html
          cp tools/twin-pregnancy.html twin-pregnancy.html
          rm -f tools/index.html tools/twin-pregnancy.html

      - name: Install v2.16 from validated plain-text payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          index_path = Path('index.html')
          addon_path = Path('tools/clinical_addons_v216/addon_v216_complete.html')
          twin_path = Path('twin-pregnancy.html')
          zip_path = Path('HN_Radiology_Suite_v2.16.0_CLINICAL_ADDONS_UPLOAD_READY.zip')

          if not addon_path.exists():
              raise SystemExit('Validated v2.16 plain-text payload is missing')

          index = index_path.read_text(encoding='utf-8')
          addon = addon_path.read_text(encoding='utf-8').strip()

          start = '<!-- HN_CLINICAL_ADDONS_V216_START -->'
          end = '<!-- HN_CLINICAL_ADDONS_V216_END -->'
          if addon.count(start) != 1 or addon.count(end) != 1:
              raise SystemExit('v2.16 payload marker validation failed')
          if 'HNClinicalAddonsV216' not in addon:
              raise SystemExit('v2.16 payload API marker missing')
          if '</body>' not in index.lower() or 'HNClinicOutput' not in index:
              raise SystemExit('Production index safety validation failed')

          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          index = pattern.sub('', index)
          pos = index.lower().rfind('</body>')
          index = index[:pos] + '\n' + addon + '\n' + index[pos:]
          index_path.write_text(index, encoding='utf-8')

          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write(index_path, 'index.html')
              z.write(twin_path, 'twin-pregnancy.html')

          print('Plain-text v2.16 payload installed:', len(addon), 'chars')
          print('Production index:', index_path.stat().st_size, 'bytes')
          print('Upload ZIP:', zip_path.stat().st_size, 'bytes')
          PY

      - name: Validate complete production build
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          index = Path('index.html')
          twin = Path('twin-pregnancy.html')
          zip_path = Path('HN_Radiology_Suite_v2.16.0_CLINICAL_ADDONS_UPLOAD_READY.zip')

          assert index.exists() and index.stat().st_size > 1000000, index.stat().st_size if index.exists() else 0
          s = index.read_text(encoding='utf-8')
          assert '</body>' in s.lower()
          assert 'HNClinicOutput' in s
          assert s.count('HN_TWIN_V215_START') == 1
          assert s.count('HN_TWIN_V215_END') == 1
          assert s.count('HN_CLINICAL_ADDONS_V216_START') == 1
          assert s.count('HN_CLINICAL_ADDONS_V216_END') == 1

          for needle in [
              'HNClinicalAddonsV216',
              '9.54+1.482*x+0.1676*x*x',
              '8.96+0.540*x+0.0003*x*x*x',
              'Residual pregnancy tissue / RPOC',
              'Placenta Accreta Spectrum',
              '+ افزودن اسکار',
              'low-lying IUD',
              'hnTwinV215Button',
          ]:
              assert needle in s, needle

          assert twin.exists() and twin.stat().st_size > 10000
          t = twin.read_text(encoding='utf-8')
          for needle in ['Twin Pregnancy Module — v2.15.0', 'INTERGROWTH-21st', 'Hadlock']:
              assert needle in t, needle

          assert zip_path.exists() and zip_path.stat().st_size > 1000
          with zipfile.ZipFile(zip_path) as z:
              assert {'index.html', 'twin-pregnancy.html'}.issubset(set(z.namelist()))
              assert z.testzip() is None

          print('COMPLETE VALIDATION OK')
          print('index:', index.stat().st_size, 'bytes')
          print('twin:', twin.stat().st_size, 'bytes')
          print('zip:', zip_path.stat().st_size, 'bytes')
          PY

      - name: Commit recovered production and upload-ready ZIP
        run: |
          git config user.name 'HN Radiology Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html twin-pregnancy.html HN_Radiology_Suite_v2.16.0_CLINICAL_ADDONS_UPLOAD_READY.zip
          if git diff --cached --quiet; then
            echo 'Production is already up to date.'
          else
            git commit -m 'Integrate Twin v2.15 and clinical add-ons v2.16 into production'
            git push origin HEAD:main
          fi

      - name: Upload ready-to-use ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HN_Radiology_Suite_v2.16.0_COMPLETE_UPLOAD_READY
          path: HN_Radiology_Suite_v2.16.0_CLINICAL_ADDONS_UPLOAD_READY.zip
          if-no-files-found: error
          retention-days: 30
