name: Build isolated CMS copy preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cms-copy-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch safe patch from test branch
        run: |
          git fetch origin cms-copy-test:refs/remotes/origin/cms-copy-test
          mkdir -p .cms_preview
          cp index.html .cms_preview/index.html
          git show origin/cms-copy-test:tools/cms_copy_safe/apply.py > .cms_preview/apply.py

      - name: Build preview only
        run: |
          cd .cms_preview
          python apply.py
          cd ..
          mv .cms_preview/index.html cms-copy-preview.html

      - name: Safety checks
        run: |
          grep -q 'HN_CMS_COPY_SAFE' cms-copy-preview.html
          grep -q 'کپی برای CMS' cms-copy-preview.html
          ! grep -q 'hn-cms-pilot' cms-copy-preview.html
          ! grep -q 'HNCMSPilot' cms-copy-preview.html
          cmp -s index.html <(git show HEAD:index.html)
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('cms-copy-preview.html').read_text(encoding='utf-8')
          out=Path('.tmp_preview_scripts'); out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I|re.S)
          for i,s in enumerate(scripts):
              (out/f'script_{i}.js').write_text(s, encoding='utf-8')
          print('scripts:', len(scripts))
          PY
          for f in .tmp_preview_scripts/*.js; do node --check "$f"; done

      - name: Commit preview page only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cms-copy-preview.html
          if git diff --cached --quiet; then
            echo 'Preview already current'
          else
            git commit -m 'Add isolated CMS copy preview page'
            git push origin main
          fi
