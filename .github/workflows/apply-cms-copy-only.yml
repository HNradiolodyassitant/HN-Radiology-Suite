name: Apply safe CMS copy button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cms-copy-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production file before patch
        run: |
          test -s index.html
          grep -q 'function ReportOutput' index.html
          grep -q 'کپی گزارش' index.html
          grep -q 'HN_V2162_NATIVE_RENAL' index.html
          grep -q 'HN_V2162_NATIVE_IUD' index.html
          grep -q 'HN_V2162_NATIVE_TWIN' index.html
          test -f tools/cms_copy_only_safe/apply.py

      - name: Apply minimal CMS copy patch
        run: python tools/cms_copy_only_safe/apply.py

      - name: Verify CMS patch invariants
        run: |
          test "$(grep -o 'HN_CMS_COPY_ONLY_SAFE' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'کپی برای CMS' index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'normalizeForCMS' index.html
          grep -q 'copyForCMS' index.html
          ! grep -q 'hn-cms-pilot' index.html
          ! grep -q 'HNCMSPilot' index.html

      - name: Validate all inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          out=Path('.tmp_cms_copy_scripts'); out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('No scripts found')
          for i,script in enumerate(scripts):
              (out/f'script_{i}.js').write_text(script, encoding='utf-8')
          print('scripts:',len(scripts))
          PY
          for f in .tmp_cms_copy_scripts/*.js; do node --check "$f"; done

      - name: Commit production index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change to commit'
          else
            git commit -m 'Add minimal Copy for CMS button to report output'
            git push origin main
          fi
