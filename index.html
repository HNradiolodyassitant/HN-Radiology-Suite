<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>HN Radiology Suite — v2.13.1 Emergency Backup</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0f172a;color:#fff;font-family:Arial,Tahoma,sans-serif}
    #boot{max-width:720px;margin:12vh auto;padding:28px;text-align:center;line-height:2}
    .card{background:#172033;border:1px solid #334155;border-radius:18px;padding:24px;box-shadow:0 20px 50px #0005}
    .small{color:#94a3b8;font-size:14px}
    .err{color:#fecaca;background:#450a0a;border:1px solid #991b1b;border-radius:12px;padding:12px;margin-top:16px;display:none}
    button{padding:10px 18px;border:0;border-radius:10px;cursor:pointer;margin-top:12px}
  </style>
</head>
<body>
  <main id="boot"><section class="card">
    <h1>HN Radiology Suite</h1>
    <p>در حال بارگذاری نسخه اضطراری v2.13.1…</p>
    <p class="small">این نسخه بدون حساب کاربری و بدون وابستگی به Cloud اجرا می‌شود.</p>
    <div id="err" class="err"></div>
  </section></main>
  <script>
  (async function(){
    const source = 'HN_Radiology_Suite_v2.12.0_MULTI_CLINIC_OUTPUT_SINGLE_FILE(1).html';
    const err = document.getElementById('err');
    try {
      const r = await fetch(source + '?backup=2131&ts=' + Date.now(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      let html = await r.text();
      html = html.replace('نسخه ۲.۱۲ — خروجی چندکلینیکی','نسخه ۲.۱۳.۱ — نسخه اضطراری GitHub');
      html = html.replace('navButton("ورود پزشک/منشی", () => setLoginOpen(true), "primary")','navButton("نسخه اضطراری v2.13.1", () => {}, "primary")');
      html = html.replace('</body>', '<div id="hn-emergency-badge" style="position:fixed;left:12px;bottom:12px;z-index:999999;background:#7f1d1d;color:white;padding:7px 10px;border-radius:9px;font:12px Arial;box-shadow:0 4px 18px #0006">Emergency Backup · v2.13.1 · Local only</div></body>');
      document.open();
      document.write(html);
      document.close();
    } catch(e) {
      err.style.display='block';
      err.innerHTML='بارگذاری نسخه اضطراری انجام نشد. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.<br><button onclick="location.reload()">تلاش مجدد</button><div class="small">'+String(e.message||e)+'</div>';
    }
  })();
  </script>
</body>
</html>
