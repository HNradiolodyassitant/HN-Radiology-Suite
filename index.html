<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5;url=https://neshatiradiology.com/">
  <link rel="canonical" href="https://neshatiradiology.com/">
  <title>انتقال به HN Radiology Suite</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #fff;
      text-align: center;
      background: radial-gradient(circle at top, #123b58 0, #061627 55%, #020b14 100%);
    }

    main {
      max-width: 620px;
      padding: 40px 32px;
      border: 1px solid rgba(85, 199, 255, .35);
      border-radius: 24px;
      background: rgba(5, 25, 43, .82);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 16px;
      color: #55c7ff;
    }

    p {
      margin: 10px 0;
      line-height: 1.9;
    }

    a {
      color: #55c7ff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>HN Radiology Suite</h1>
    <p>در حال انتقال به نسخهٔ امن و جدید سامانه هستید…</p>
    <p><a href="https://neshatiradiology.com/">اگر انتقال انجام نشد، اینجا کلیک کنید.</a></p>
  </main>

  <script>
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (_) {
        // The redirect below still runs if old cache cleanup is unavailable.
      } finally {
        window.location.replace("https://neshatiradiology.com/");
      }
    })();
  </script>
</body>
</html>
